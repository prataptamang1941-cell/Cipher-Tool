<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Symmetrical Cipher Translator</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; background-color: #f4f4f9; }
        h2 { text-align: center; color: #333; }
        textarea { width: 100%; height: 120px; padding: 10px; margin-top: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 5px; font-size: 16px; box-sizing: border-box; resize: vertical; }
        .button-container { display: flex; gap: 10px; justify-content: center; margin-bottom: 15px; }
        button { padding: 12px 24px; font-size: 16px; cursor: pointer; border: none; border-radius: 5px; background-color: #007bff; color: white; transition: background-color 0.3s; }
        button:hover { background-color: #0056b3; }
        button.decode { background-color: #28a745; }
        button.decode:hover { background-color: #218838; }
        button.clear { background-color: #dc3545; }
        button.clear:hover { background-color: #c82333; }
        label { font-weight: bold; color: #555; }
    </style>
</head>
<body>

    <h2>Symmetrical Cipher Tool</h2>

    <label for="inputText">Input Text:</label>
    <textarea id="inputText" placeholder="Type your text here..."></textarea>

    <div class="button-container">
        <button id="btnEncode">Encode</button>
        <button id="btnDecode" class="decode">Decode</button>
        <button id="btnClear" class="clear">Clear</button>
    </div>

    <label for="outputText">Output Result:</label>
    <textarea id="outputText" readonly placeholder="Result will appear here..."></textarea>

    <script>
        // A perfectly symmetrical mapping (Involution)
        // If A -> Q, then Q -> A.
        const cipherMap = {
            'A': 'Q', 'Q': 'A',
            'B': 'W', 'W': 'B',
            'C': 'E', 'E': 'C',
            'D': 'R', 'R': 'D',
            'F': 'Y', 'Y': 'F',
            'G': 'U', 'U': 'G',
            'H': 'Z', 'Z': 'H',
            'I': 'O', 'O': 'I',
            'J': 'P', 'P': 'J',
            'K': 'V', 'V': 'K',
            'L': 'S', 'S': 'L',
            'M': 'N', 'N': 'M',
            'T': 'X', 'X': 'T'
        };

        function translate() {
            const input = document.getElementById('inputText').value.toUpperCase();
            const outputArea = document.getElementById('outputText');
            let result = '';

            for (let i = 0; i < input.length; i++) {
                const char = input[i];
                // If the character exists in our map, swap it. Otherwise, keep it as is (spaces, punctuation).
                result += cipherMap[char] || char;
            }

            outputArea.value = result;
        }

        // Event listeners
        document.getElementById('btnEncode').addEventListener('click', translate);
        document.getElementById('btnDecode').addEventListener('click', translate); // Same function for both!

        document.getElementById('btnClear').addEventListener('click', function() {
            document.getElementById('inputText').value = '';
            document.getElementById('outputText').value = '';
        });
    </script>
</body>
</html>
